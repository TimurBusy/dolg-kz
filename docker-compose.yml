services:
  postgres:
    image: postgres:17-alpine
    container_name: dolg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dolg
      POSTGRES_USER: dolg
      POSTGRES_PASSWORD: dolg_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolg -d dolg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: dolg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dolg-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: dolg
      MINIO_ROOT_PASSWORD: dolg_minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
volumes:
  postgres_data:
  redis_data:
  minio_data:
